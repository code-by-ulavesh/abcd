events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # Main preview proxy - path based to avoid wildcard DNS need
    upstream api { server api:3001; }
    server {
        listen 80;
        client_max_body_size 20m;

        # Frontend vite dev or built app proxied elsewhere
        # Preview proxy: /preview/<sessionId>/ -> runtime container
        location ~ ^/preview/([^/]+)/?(.*)$ {
            # Forward to API which does dynamic proxy map lookup
            proxy_pass http://api/preview-proxy/$1/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            # fallback - serve api health
            proxy_pass http://api;
        }
    }
}
