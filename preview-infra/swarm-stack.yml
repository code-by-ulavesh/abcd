version: "3.8"
services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources:
        limits: { memory: 256M, cpus: '0.25' }
        reservations: { memory: 128M }
      restart_policy: { condition: on-failure, delay: 5s }
    networks: [preview-net]

  api:
    image: ghcr.io/your-org/preview-api:latest
    # For local build: build: ./server
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/previews:/tmp/previews
    environment:
      - REDIS_URL=redis://redis:6379
      - PREVIEW_TTL_MINUTES=15
      - PREVIEW_MAX_CONCURRENT_BUILDS=2
      - PREVIEW_MAX_RUNTIMES=20
      - PREVIEW_MAX_PER_USER=2
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources:
        limits: { memory: 512M, cpus: '0.75' }
        reservations: { memory: 256M }
      restart_policy: { condition: on-failure, delay: 5s }
    networks: [preview-net]

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources:
        limits: { memory: 128M, cpus: '0.25' }
    networks: [preview-net]

  # Optional: pre-warmed builder pool (saves 20s on first build)
  # builder-warm:
  #   image: ghcr.io/cirruslabs/flutter:stable
  #   command: sleep infinity
  #   deploy:
  #     replicas: 1
  #     resources: { limits: { memory: 512M } }

networks:
  preview-net:
    driver: overlay
    attachable: true
